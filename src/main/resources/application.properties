spring.application.name=stock-sync-service
spring.datasource.url=jdbc:h2:mem:stocksync
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
vendor.b.csv-path=/tmp/vendor-b/stock.csv
vendor.a.products-url=http://localhost:8080/api/vendor-a/products
# Every 10 seconds (cron: second minute hour day month weekday)
stock.sync.cron=*/10 * * * * ?

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
